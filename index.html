<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#070b16" />
    <title>守城英雄</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* 加载画面写在这里，样式表还没下载完也能显示 */
      html,body{margin:0;background:#070b16}
      #boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 42%,#13203a 0%,#070b16 62%);color:#f3c867;font-family:"PingFang SC","Microsoft YaHei",sans-serif;transition:opacity .5s}
      #boot.gone{opacity:0;pointer-events:none}
      #boot svg{filter:drop-shadow(0 0 18px rgba(255,200,100,.35));animation:bootPulse 2.2s ease-in-out infinite}
      .boot-title{font-size:34px;font-weight:900;letter-spacing:10px;text-shadow:0 0 18px rgba(255,190,90,.6)}
      .boot-bar{width:180px;height:3px;border-radius:2px;background:rgba(243,200,103,.15);overflow:hidden}
      .boot-bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,#f3c867,transparent);animation:bootBar 1.1s linear infinite}
      .boot-star{animation:bootStar 1.6s ease-in-out infinite}
      @keyframes bootPulse{50%{filter:drop-shadow(0 0 30px rgba(255,200,100,.6))}}
      @keyframes bootBar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @keyframes bootStar{50%{opacity:.4}}
    </style>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <!-- 加载画面（设计书 57.4）：脚本还没加载完就先显示，加载完由 main.js 移除 -->
    <div id="boot">
      <svg viewBox="-100 -100 200 200" width="150" height="150" aria-hidden="true">
        <defs>
          <radialGradient id="bootGlow"><stop offset="0" stop-color="#ffcf6a" stop-opacity="0.45" /><stop offset="1" stop-color="#ffcf6a" stop-opacity="0" /></radialGradient>
          <linearGradient id="bootShield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26355e" /><stop offset="1" stop-color="#0a0f20" /></linearGradient>
        </defs>
        <circle r="98" fill="url(#bootGlow)" />
        <circle r="66" fill="none" stroke="#f3c867" stroke-width="3" class="boot-ring" />
        <path d="M0 -44 Q 17 -54 33 -40 L 33 -12 C 33 15 16 33 0 47 C -16 33 -33 15 -33 -12 L -33 -40 Q -17 -54 0 -44 Z" fill="url(#bootShield)" stroke="#f3c867" stroke-width="4" stroke-linejoin="round" />
        <path d="M-10 30 L-9 -6 L-11 -6 L-11 -12 L-6 -12 L-6 -8 L-2 -8 L-2 -12 L2 -12 L2 -8 L6 -8 L6 -12 L11 -12 L11 -6 L9 -6 L10 30 Z" fill="#f3c867" />
        <circle cy="-66" r="5" fill="#fff" class="boot-star" />
      </svg>
      <div class="boot-title">守城英雄</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <div id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="ui"></div>
    </div>
    <div id="rotate-hint"><div class="phone">📱</div>请把手机横过来玩《守城英雄》</div>
    <noscript>请开启 JavaScript 后再游玩《守城英雄》。</noscript>

    <!-- 按顺序加载：基础 → 数据 → 逻辑 → 画面 → 界面 → 入口 -->
    <script src="src/core/ns.js"></script>
    <script src="src/data/config.js"></script>
    <script src="src/data/monsters.js"></script>
    <script src="src/data/gear.js"></script>
    <script src="src/data/levels.js"></script>
    <script src="src/data/story.js"></script>
    <script src="src/data/outfits.js"></script>
    <script src="src/data/missions.js"></script>
    <script src="src/data/town.js"></script>
    <script src="src/data/achievements.js"></script>
    <script src="src/game/progression.js"></script>
    <script src="src/game/battle.js"></script>
    <script src="src/game/bosses.js"></script>
    <script src="src/game/bot.js"></script>
    <script src="src/game/save.js"></script>
    <script src="src/game/modes.js"></script>
    <script src="src/render/sprites.js"></script>
    <script src="src/render/audio.js"></script>
    <script src="src/render/music.js"></script>
    <script src="src/render/art.js"></script>
    <script src="src/render/creatures.js"></script>
    <script src="src/render/logo.js"></script>
    <script src="src/render/renderer.js"></script>
    <script src="src/ui/ui.js"></script>
    <script src="src/ui/ui-story.js"></script>
    <script src="src/ui/ui-collection.js"></script>
    <script src="src/main.js"></script>
    <script>
      // 可安装 / 离线（设计书 43）：只在 http(s) 下注册，双击打开本地文件时跳过
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('离线缓存注册失败', e)));
      }
    </script>
  </body>
</html>
